<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidBuild Cordova</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 60px; }
        h1 { color: #2EA86A; }
    </style>
</head>
<body>
    <h1>Hello from AndroidBuild!</h1>
    <p>Application Cordova avec plugins</p>
    <div id="info">Chargement...</div>
    <button onclick="showAlert()">Tester Dialogs</button>
    <script src="cordova.js"></script>
    <script>
        document.addEventListener('deviceready', function() {
            var info = document.getElementById('info');
            if (window.device) {
                info.innerHTML = 'Plateforme: ' + device.platform + ' v' + device.version;
            }
        }, false);
        function showAlert() {
            if (navigator.notification) {
                navigator.notification.alert('Compile par AndroidBuild!', null, 'Succes', 'OK');
            }
        }
    </script>
</body>
</html>
