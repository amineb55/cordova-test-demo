# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# KSP: use KSP1 (default). KSP2 is intentionally NOT enabled — the Hilt Gradle
# plugin does not pass its processor options through KSP2 in this toolchain
# combo, which makes Hilt error with "Did you forget to apply the Gradle Plugin?".
